<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Notes</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <nav id="navbar">
            <h1>Zomato Notes</h1>

            <input
                type="text"
                id="searchInput"
                placeholder="Search notes by title or tag..."
            >
            <label for="sortSelect">Sort By:</label>

<select id="sortSelect">
    <option value="relevance">Relevance</option>
    <option value="date">Date</option>
</select>
<section id="lookupSection">

    <h3>Jump to Exact Title</h3>

    <input
        type="text"
        id="lookupTitle"
        placeholder="Enter exact title"
    >
    <label for="algoSelect">Algorithm</label>

<select id="algoSelect">
    <option value="iterative">Iterative</option>
    <option value="recursive">Recursive</option>
</select>

    <button id="lookupButton">
        Find
    </button>

</section>
<section id="quickTagSection">

    <h3>Quick Tag Jump</h3>

    <button class="tagButton" data-tag="work">Work</button>

    <button class="tagButton" data-tag="health">Health</button>

    <button class="tagButton" data-tag="recipes">Recipes</button>

    <button class="tagButton" data-tag="travel">Travel</button>

    <button class="tagButton" data-tag="random">Random</button>

</section>
<h3>🤖 Smart Search (AI)</h3>

<div class="smart-search">

    <input
        type="text"
        id="smartSearchInput"
        placeholder="Search by meaning..."
    >

    <button id="smartSearchButton">
        Smart Search
    </button>

</div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="container">

        <!-- Sidebar -->
        <aside id="sidebar">

            <h2>Categories</h2>

            <div id="categoryTree"></div>

        </aside>

        <!-- Main Section -->
        <section id="content">

            <!-- Add Note Form -->
            <section id="add-note">

                <h2>Add Note</h2>

                <form id="noteForm">

                    <label for="title">Title</label>
                    <input
                        type="text"
                        id="title"
                        placeholder="Enter title"
                    >

                   <label for="contentInput">Content</label>
<textarea
    id="contentInput"
    placeholder="Write your note..."
></textarea>

                    <label for="tag">Tag</label>
                    <input
                        type="text"
                        id="tag"
                        placeholder="Example: work"
                    >

                    <label for="ownerId">Owner ID</label>
                    <input
                        type="number"
                        id="ownerId"
                        placeholder="Enter owner ID"
                    >

                    <p id="errorMessage"></p>

                    <button type="submit">
                        Add Note
                    </button>

                </form>

            </section>

            <!-- Loading -->
            <p id="loadingMessage">
                Loading notes...
            </p>

            <!-- API Errors -->
            <p id="apiError"></p>

            <!-- Notes -->
            <section id="notesContainer">

            </section>

        </section>

    </main>

    <!-- Footer -->
    <footer>

        <p>
            © 2026 Zomato Notes
        </p>

    </footer>

    <script src="script.js"></script>

</body>
</html>
